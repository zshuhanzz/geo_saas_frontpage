server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Use Google DNS for Cloud Run domain resolution
    resolver 8.8.8.8 8.8.4.4 valid=30s;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    
    # Proxy API requests to the API service
    # API_URL_PLACEHOLDER will be replaced by entrypoint.sh
    location /api/ {
        set $backend "API_URL_PLACEHOLDER";
        rewrite ^/api/(.*) /api/$1 break;
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host geo-admin-api-414105678919.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    
    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
