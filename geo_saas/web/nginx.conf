server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Use Google DNS for Cloud Run domain resolution
    resolver 8.8.8.8 8.8.4.4 valid=30s;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    
    # Proxy Agent API requests to the geo_agent service
    # VITE_AGENT_API_URL_PLACEHOLDER will be replaced by entrypoint.sh at container startup
    location /api/agent/ {
        set $agent_backend "VITE_AGENT_API_URL_PLACEHOLDER";
        rewrite ^/api/agent/(.*) /api/agent/$1 break;
        proxy_pass $agent_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect ~*^https?://[^/]+(/.*)$ https://$host$1;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy API requests to the SaaS API service
    # VITE_API_URL_PLACEHOLDER will be replaced by entrypoint.sh at container startup
    location /api/ {
        set $backend "VITE_API_URL_PLACEHOLDER";
        rewrite ^/api/(.*) /api/$1 break;
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Rewrite backend redirect Location headers to use the original
        # client-facing HTTPS host (not the internal backend URL)
        proxy_redirect ~*^https?://[^/]+(/.*)$ https://$host$1;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    
    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
